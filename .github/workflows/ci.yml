name: Demo Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write build artifact file
        run: |
          echo "demo-build artifact generated at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > demo-build.txt
          cat demo-build.txt
      - name: Upload demo-build artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-build
          path: demo-build.txt
